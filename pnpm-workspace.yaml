# Add paths to each package's folder, or glob patterns
packages:
  - 'testers/*'
  - 'package'
allowBuilds:
  esbuild: true
  sharp: true
peerDependencyRules:
  ignoreMissing:
    - vite
    - react
    - react-dom
    - '@types/react'
    - tslib
    - quill-delta
    - rxjs
  allowAny:
    - rustikus
